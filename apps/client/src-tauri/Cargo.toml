[package]
name = "mindough"
version = "0.0.0"
description = "Mindough：用 FS 依赖把任务串起来的多端任务管理"
authors = ["Rei Leo"]
license = "MIT"
repository = "https://github.com/reiy-leo/Mindough"
edition = "2021"
rust-version = "1.77.2"

[lib]
# 移动端需要 staticlib / cdylib
name = "mindough_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地 SQLite：bundled 自带 SQLite 源码，各平台（含 iOS / Android）不依赖系统库
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
