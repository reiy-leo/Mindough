[package]
name = "mindough"
version = "0.1.0"
description = "Mindough：用 FS 依赖把任务串起来的多端任务管理"
authors = ["Rei Leo"]
license = "MIT"
repository = "https://github.com/reiy-leo/Mindough"
edition = "2021"
rust-version = "1.77.2"

[lib]
# 移动端需要 staticlib / cdylib
name = "mindough_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 窗口透明（侧边栏毛玻璃）要用，tauri.conf.json 的 app.macOSPrivateApi 同时开着
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-os = "2"
# 登录：系统浏览器打开 Google 登录（opener），mindough:// 回调（deep-link）
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# 提醒：系统通知（桌面即时发；手机可以交给系统排好，app 关着也会响）
tauri-plugin-notification = "2"
# 附件下载：桌面弹系统保存框（Rei 2026-10-25 起）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地 SQLite：bundled 自带 SQLite 源码，各平台（含 iOS / Android）不依赖系统库
rusqlite = { version = "0.32", features = ["bundled"] }

# 桌面端：deep link 打开时交给已经开着的那个窗口（Windows / Linux 会新起进程带上链接）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Windows：看系统版本决定用不用 Mica（Win11 build ≥ 22000），tauri-plugin-os 已经带着它
[target.'cfg(windows)'.dependencies]
os_info = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
