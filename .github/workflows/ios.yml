# iOS：打未签名的 ipa（Rei 2026-10-16：免费 Apple ID 自用，不走 TestFlight）。
# Rei 的 2018 Intel Mac 只能到 Xcode 26.3，iPhone 已是 iOS 27，所以在 Actions 的 Apple 芯片 runner 上用最新 Xcode 打包，
# 下载 artifact 后在 Mac 上用 Sideloadly 拿免费 Apple ID 签名安装（7 天有效）。步骤见 docs/IOS.md。
# 只手动触发（Actions → Build iOS → Run workflow），不跟 v* 标签。
name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS（未签名 ipa）
    # Xcode 27 镜像（GitHub 公开预览，Apple 芯片）；iOS 27 真机要 Xcode 27 的 SDK
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # gen/ 不进仓库，CI 里现生成 Xcode 工程
      - name: tauri ios init
        working-directory: apps/client
        run: |
          if [ ! -d src-tauri/gen/apple ]; then pnpm tauri ios init --ci; fi

      # Xcode 工程里的构建脚本（tauri ios xcode-script）要 `tauri ios build` 在跑时才能编 Rust，不能直接 xcodebuild。
      # 做法：工程里关掉签名（签名交给 Sideloadly），照常 `tauri ios build`：归档（archive）能成，导出 ipa 那步要签名会失败，
      # 失败不管，直接从 .xcarchive 里拿 .app 自己打成 ipa。
      - name: 工程关掉签名
        working-directory: apps/client/src-tauri/gen/apple
        run: |
          for p in *.xcodeproj/project.pbxproj; do
            perl -0pi -e 's/buildSettings = \{/buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";/g' "$p"
            grep -c "CODE_SIGNING_ALLOWED = NO" "$p"
          done

      - name: tauri ios build（归档，不签名）
        working-directory: apps/client
        env:
          # 随便一个占位团队号，免得 CLI 找团队；签名已关，不会用到
          APPLE_DEVELOPMENT_TEAM: AAAAAAAAAA
        run: |
          set +e
          pnpm tauri ios build --ci --target aarch64 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "tauri ios build 退出码 ${PIPESTATUS[0]}（导出那步失败是预期的）"
          exit 0

      - name: 打成 ipa
        run: |
          APP=$(find apps/client/src-tauri/gen/apple "$HOME/Library/Developer/Xcode" -maxdepth 8 -path '*.xcarchive/Products/Applications/*.app' -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "没找到归档里的 .app，构建日志最后 80 行："; tail -80 "$RUNNER_TEMP/build.log"; exit 1
          fi
          echo "app: $APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Mindough-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/Mindough-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: mindough-ios-unsigned
          if-no-files-found: error
          path: Mindough-unsigned.ipa
